    <div class="title-large">郡猫玩原神，原神玩郡猫。</div>
    
    <div class="read-text">    自芙宁娜jc cyz后，cyz一蹶不振，成了路边也够来了都能踢几脚的滚木。小郡猫们开始朝拜芙宁娜，芙宁娜则将家乡特产原神赠与小郡猫们。</div>

    <div class="read-text">    你说得对，但原神是一款由猫哈游制作的后面忘了。</div>

    <div class="read-text">    郡猫们从未见过如此N而B之的东西，整宿整宿地玩，每天除了和小雅猫谈恋爱就是玩原神。</div>

    <div class="read-text">    为了防止郡猫们过于沉迷，芙宁娜设置了一些目标，例如AK IOI，JC cyz，10s刷10道黑题，完成才能玩原神。就此，郡猫进入大原神时代，史称原神元年。</div>
