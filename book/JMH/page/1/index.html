    <div class="read-text">    从前有一个郡猫，被困于机房内，沉睡998244353年后，终于醒来，他抄起矿泉水瓶，朝机房砸去。__int128沉下去，bool浮上去，他担心世界会塌下，便头顶天，脚蹬地，10086年后他累死了。但他的左眼唤作AC，右眼变换为WA，骨骼成了高精度，血液化为for循环。</div>

    <div class="read-text">    后来世间万物孕育出五行：AC代表光明，WA代表黑暗，TLE代表时间，MLE代表空间，CE代表法度。又有八卦：int对整型，float对浮点，bool对二元，char对字符，if对因果，while对循环，return对结束，void对虚无。</div>
