<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滚木</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #121212;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, sans-serif;
            gap: 4rem;
            padding: 2rem;
        }

        .read-text {
            color: #E0E0E0;
            font-size: 19px; 
            letter-spacing: 0.03em; 
            line-height: 1.6; 
            word-spacing: 0.02em;
        }

	.title-large {
	    color: #E0E0E0;
            font-size: clamp(2.5rem, 8vw, 5rem);
            letter-spacing: 0.1em; /* 大标题宽松字距，提升辨识度 */
            line-height: 1.2;
        }
    </style>
</head>
<body>
    <div class="title-large">滚木</div>
    
    <div class="read-text">这界面咋没字啊</div>
    </body>
</html>
